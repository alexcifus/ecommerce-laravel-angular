<div class="card">
    <!--begin::Card body-->
    <span class="spinner-border spinner-border-sm align-middle ms-2" *ngIf="isLoading$  | async"></span>
    <div class="card-body border-top p-9">
        <div class="row mb-6">
            <div class="col-lg-8 fv-row fv-plugins-icon-container">
                <label class="fw-semibold fs-6 py-2">Tiulo: (*)</label>
                <input type="text" name="title" [(ngModel)]="title" class="form-control form-control-lg form-control-solid" placeholder="Por ejemplo: The best tablet Collection 2023">
            </div>
            <div class="col-lg-6 fv-row fv-plugins-icon-container">
                <label class="fw-semibold fs-6 py-2">Label: (Opcional)</label>
                <input type="text" name="label" [(ngModel)]="label" class="form-control form-control-lg form-control-solid" placeholder="Por ejemplo: Starting at 9900">
            </div>

            <div class="col-lg-6 fv-row fv-plugins-icon-container">
                <label class="fw-semibold fs-6 py-2">Subtitulo: (*)</label>
                <input type="text" name="subtitle" [(ngModel)]="subtitle" class="form-control form-control-lg form-control-solid" placeholder="Por ejemplo: Exclusive offer 9900">
            </div>
        </div>
        <div class="row mb-6">
    <!-- Imagen -->
    <div class="col-lg-6 col-md-6 col-sm-12 my-2">
        <label class="form-label">Sube tu imagen: (*)</label>
        <div class="custom-file">
            <input type="file" class="custom-file-input" id="customFile" accept=".jpeg, .bmp, .jpg, .png, .gif, .webp" (change)="processFile($event)">
            <label class="custom-file-label" for="customFile">Choose file</label>
        </div>
        <div class="">
            <img class="img py-4" [src]="imagen_previsualiza" width="200" alt="">
        </div>
    </div>

    <!-- Link y Color agrupados verticalmente -->
    <div class="col-lg-6 col-md-6 col-sm-12">
        <div class="row mb-3">
            <div class="col-12 fv-row fv-plugins-icon-container">
                <label class="fw-semibold fs-6 py-2">Link: (Opcional)</label>
                <input type="text" name="link" [(ngModel)]="link" class="form-control form-control-lg form-control-solid" placeholder="Por ejemplo: http://dominio.com">
            </div>
        </div>
        <div class="row">
            <div class="col-12 fv-row fv-plugins-icon-container">
                <label for="etiqueta_especial" class="required fw-bold fs-6 mb-2">Color: </label>
                <input class="form-control form-control-color" type="color" id="color" name="color" [(ngModel)]="color" style="width: 3rem; height: 2.5rem; padding: 0;" />
            </div>
        </div>
    </div>
</div>

        <div class="row mb-6">
            <div class="col-3">
                <button class="btn btn-primary" (click)="save()">Guardar</button>
            </div>

            
        </div>
    </div>
</div>
